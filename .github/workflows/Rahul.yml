name: Learning Scanning Tools

on:
  push:
    branches:
    - main

permissions:
  id-token: write
  contents: read  

jobs:
  build-and-deploy:
    name: Creating Azure Resources
    runs-on: ubuntu-latest

    steps:

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: Environment/Pre-Prod
        run: terraform init
        
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Init TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint
         
      - name: Plan
        working-directory: Environment/Pre-Prod
        run: terraform plan

      - name: Apply
        working-directory: Environment/Pre-Prod
        run: terraform apply -auto-approve  

      

        

    
